<!doctype html>
<html lang="es" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD Productos - Bootstrap 6</title>

    <!-- bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>

    <!-- iconos -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <nav class="navbar sticky-top md:navbar-expand bg-1 mb-4">
      <div class="container">
        <a
          class="navbar-brand d-flex align-items-center gap-2 fw-bold"
          href="#"
        >
          <span
            class="bg-primary fg-contrast-primary rounded-4 px-2 d-inline-flex"
          >
            <i class="bi bi-box-seam-fill"></i>
          </span>
          <span>Inventario</span>
        </a>
        <button
          class="btn-icon navbar-toggler"
          type="button"
          data-bs-toggle="drawer"
          data-bs-target="#navbarDrawer"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer">
          <div class="drawer-header border-bottom">
            <h5 class="drawer-title fw-semibold">Menú</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="drawer"
            ></button>
          </div>
          <div class="drawer-body mb-2 md:mb-0">
            <ul class="nav navbar-nav md:ms-auto">
              <li class="nav-item">
                <a class="nav-link active" href="#">Inicio</a>
              </li>
              <li class="nav-item">
                <button
                  class="nav-link d-flex align-items-center gap-1"
                  type="button"
                  data-bs-toggle="menu"
                >
                  <span>Información</span>
                  <i class="bi bi-chevron-down fs-xs"></i>
                </button>
                <div class="menu shadow-lg">
                  <a class="menu-item" href="#">
                    <i class="bi bi-box-seam menu-item-icon"></i>
                    <span>Productos</span>
                  </a>
                  <a class="menu-item" href="#">
                    <i class="bi bi-tags menu-item-icon"></i>
                    <span>Marcas</span>
                  </a>
                  <hr class="menu-divider" />
                  <a class="menu-item" href="#">
                    <i class="bi bi-search menu-item-icon"></i>
                    <span>Consultar</span>
                  </a>
                </div>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Contacto</a>
              </li>
            </ul>
          </div>
        </dialog>
      </div>
    </nav>

    <main class="container pb-8">
      <div class="text-center mb-6">
        <h1 class="fs-2xl fw-bold mb-1">Catálogo de Productos</h1>
        <p class="fg-3 mb-0">
          Gestiona los artículos, categorías y precios del sistema
        </p>
      </div>

      <div class="d-flex justify-content-between align-items-center gap-3 mb-4">
        <div class="d-flex align-items-center gap-2">
          <h2 class="fs-lg fw-semibold mb-0">Listado de Productos</h2>
          <span class="badge badge-subtle theme-primary rounded-pill"
            >Activos</span
          >
        </div>
        <button
          type="button"
          class="btn-solid btn-styled theme-primary"
          data-bs-toggle="dialog"
          data-bs-target="#exampleDialog"
        >
          <i class="bi bi-plus-lg"></i>
          <span>Agregar Producto</span>
        </button>
      </div>

      <dialog class="dialog" id="exampleDialog">
        <form id="formProducto">
          <div class="dialog-header">
            <h2 class="dialog-title fw-semibold">Nuevo Producto</h2>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="dialog"
            ></button>
          </div>

          <div class="dialog-body vstack gap-4">
            <div class="form-field">
              <label for="inputNombre" class="form-label"
                >Nombre del producto</label
              >
              <input
                type="text"
                class="form-control"
                id="inputNombre"
                placeholder="Ej. Teclado Gamer"
                required
              />
            </div>

            <div class="form-field">
              <label for="inputCategoria" class="form-label">Categoría</label>
              <select class="form-control" id="inputCategoria" required>
                <option value="" selected disabled>
                  Selecciona una categoría...
                </option>
                <option value="Periféricos">Periféricos</option>
                <option value="Pantallas">Pantallas</option>
                <option value="Audio">Audio</option>
                <option value="Componentes">Componentes</option>
              </select>
            </div>

            <div class="form-field">
              <label for="inputPrecio" class="form-label">Precio ($)</label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input
                  type="number"
                  class="form-control"
                  id="inputPrecio"
                  placeholder="0.00"
                  required
                />
              </div>
            </div>
          </div>

          <div class="dialog-footer bg-1">
            <button
              type="button"
              class="btn-subtle theme-secondary"
              data-bs-dismiss="dialog"
            >
              Cancelar
            </button>
            <button type="submit" class="btn-solid btn-styled theme-primary">
              Guardar producto
            </button>
          </div>
        </form>
      </dialog>

      <div class="table-card bg-body shadow-sm mb-5">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="bg-1">
              <tr>
                <th scope="col" class="fg-3">#</th>
                <th scope="col" class="fg-3">Producto</th>
                <th scope="col" class="fg-3">Categoría</th>
                <th scope="col" class="fg-3">Precio</th>
                <th scope="col" class="fg-3">Operaciones</th>
              </tr>
            </thead>
            <tbody id="tablaProductos"></tbody>
          </table>
        </div>
      </div>

      <nav class="d-flex justify-content-center">
        <ul class="pagination">
          <li class="page-item">
            <a class="page-link" href="#">&laquo;</a>
          </li>
          <li class="page-item"><a class="page-link active" href="#">1</a></li>
          <li class="page-item"><a class="page-link" href="#">2</a></li>
          <li class="page-item"><a class="page-link" href="#">3</a></li>
          <li class="page-item">
            <a class="page-link" href="#">&raquo;</a>
          </li>
        </ul>
      </nav>
    </main>

    <script>
      const productos = [
        {
          id: 1,
          nombre: "Teclado Mecánico",
          categoria: "Periféricos",
          precio: 85.0,
        },
        {
          id: 2,
          nombre: "Monitor 24 pulgadas",
          categoria: "Pantallas",
          precio: 199.99,
        },
        {
          id: 3,
          nombre: "Mouse Inalámbrico",
          categoria: "Periféricos",
          precio: 35.5,
        },
        {
          id: 4,
          nombre: "Auriculares Gaming",
          categoria: "Audio",
          precio: 60.0,
        },
      ];

      const tbody = document.getElementById("tablaProductos");
      tbody.innerHTML = "";
      productos.forEach((producto) => {
        tbody.innerHTML += `
          <tr>
            <th scope="row">${producto.id}</th>
            <td>${producto.nombre}</td>
            <td>${producto.categoria}</td>
            <td>$${producto.precio.toFixed(2)}</td>
            <td>
              <button class="btn-subtle theme-warning btn-sm" title="Editar">
                <i class="bi bi-pencil-square"></i>
              </button>
              <button class="btn-subtle theme-danger btn-sm" title="Eliminar">
                <i class="bi bi-trash3"></i>
              </button>
            </td>
          </tr>
        `;
      });
    </script>
  </body>
</html>
